# T-City Lite — 开发/测试环境专用模块
#
# ⚠️ 生产环境不要 exec 本文件。
# 用法（本地开发服务器）：在 server.cfg 末尾加一行
#   exec configs/modules/dev.cfg
#
# 包含：游戏内自动化测试框架（/test、/stress）
ensure custom-testing

# Agent Ops 观测/介入（server-only；事件环、状态/健康、/agent 命令）
# 依赖 custom-police 的只读表；仅开发环境加载，生产不要 exec 本文件。
ensure custom-agent-ops

# 服务端 E2E harness（无客户端；跑完注释掉）
# setr tcity_e2e 1
# ensure tcity-e2e

# ── 调试/诊断工具（生产不 exec 本文件）──────────────────────────────
# 2026-11-10 从 core.cfg / custom.cfg 移出：它们是给开发者看的工具，
# 默认加载等于把这些入口开给玩家。
ensure hud-position-tool   # /mapsize /ringpos /huddebug
ensure custom-debug        # /debugscreen /fullfix /watchscreen 等
