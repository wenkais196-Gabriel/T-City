# T-City Lite v0.5 - 犯罪模块统一配置文件

# 模块总开关 (是否运行犯罪系统，默认 true)
set crime_enable "true"

# 子玩法独立开关
set crime_enable_storerobbery "true"
set crime_enable_houserobbery "true"
set crime_enable_drugs "true"  # v0.7 Cartel 毒品产业链已重建

# 玩法冷却时间上限 (单位：秒，防重复刷取)
set crime_cooldown_storerobbery "1800"  # 小型商店抢劫 30 分钟 CD
set crime_cooldown_houserobbery "1800"  # 单个房屋入室 30 分钟 CD
set crime_cooldown_drugs "300"          # 毒品交付 5 分钟 CD

# 基础在线警察人数限制
set crime_min_police_storerobbery "2"   # 最少 2 名警察在岗（纵深防御）
set crime_min_police_houserobbery "2"   # 最少 2 名警察在岗（纵深防御）
set crime_min_police_drugs "0"          # 毒品交付最少 0 名警察
set crime_min_police_launder "0"        # 洗钱最少 0 名警察

# 洗钱管道参数 (v0.5)
set crime_launder_rate "0.75"           # 洗钱折旧率 (0.75 = 25% 手续费)
set crime_launder_min "1000"            # 单次最低洗钱金额
set crime_cooldown_launder "60"         # 洗钱冷却时间 (秒)

# 启动相关资源
ensure qb-doorlock
ensure qb-storerobbery
ensure qb-houserobbery
ensure qb-drugs  # v0.7 Cartel 毒品产业链已重建
ensure qb-pawnshop
