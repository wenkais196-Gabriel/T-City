# T-City Lite v0.5 - 犯罪模块统一配置文件

# 模块总开关 (是否运行犯罪系统，默认 true)
set crime_enable "true"

# 子玩法独立开关
set crime_enable_storerobbery "true"
set crime_enable_houserobbery "true"
set crime_enable_drugs "true"

# 玩法冷却时间上限 (单位：秒，防重复刷取)
set crime_cooldown_storerobbery "1800"  # 小型商店抢劫 30 分钟 CD
set crime_cooldown_houserobbery "1800"  # 单个房屋入室 30 分钟 CD
set crime_cooldown_drugs "300"          # 毒品交付 5 分钟 CD

# 基础在线警察人数限制
set crime_min_police_storerobbery "0"   # 最少 0 名警察在岗
set crime_min_police_houserobbery "0"   # 最少 0 名警察在岗
set crime_min_police_drugs "0"          # 毒品交付最少 0 名警察

# 启动相关资源
ensure qb-doorlock
ensure qb-storerobbery
ensure qb-houserobbery
ensure qb-drugs
ensure qb-pawnshop
