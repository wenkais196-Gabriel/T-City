# T-City Lite v0.3 - 安全边界配置文件
# 用于统一配置全服安全边界、防刷防作弊机制

# 关键敏感事件/触发器的频率限制 (毫秒)
# 限制单个玩家每秒可触发关键逻辑的频率
set security_rate_limit_ms "1000"

# 敏感资源瞬间变化限额 (防御机制)
set security_max_add_money_limit "50000"    # 单次允许增加的最大资金数量 (cash/bank)
set security_max_add_item_limit "20"        # 单次允许添加的同类物品最大数量

# 交易/购买/交互的最大物理距离检验 (米)
# 杜绝客户端远程虚假触发商店购买、ATM 等实体交互
set security_max_interaction_distance "10.0"

# 严格车辆生成校验开关
# 校验玩家在非管理员或非执勤特殊职业时是否非法召唤/刷车
set security_check_vehicle_spawn "true"

# 严格赐予武器限制开关
# 审计非管理员及非法赋予的武器获取行为
set security_check_weapon_give "true"

# Discord 统一安全警报 Webhook 链接
# ⚠️ 替换为你的 Discord Webhook URL
# 留空字符串 = 禁用 Discord 安全警报推送
set security_discord_webhook ""
