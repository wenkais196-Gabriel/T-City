# T-City Lite v0.3 - 经济平衡配置文件
# 用于统一配置全服的经济倍率与流向微调机制

# 全局资金/奖励倍率 (任务结算、抢劫结算、打工薪水等)
set economy_reward_scale "1.0"

# 全局价格/开销倍率 (商店商品售价、修车费用、医疗费等，默认 1.0)
set economy_price_scale "1.0"

# 自动自适应经济分析窗口时间 (单位：分钟。如果设置为 0 则禁用自动倍率微调)
set economy_sample_window_minutes "60"

# 自适应触发阈值与倍率步长限制 (全服每小时流向分析)
set economy_high_inflation_net_per_hour "150000"  # 当每小时全服净流入 > 15w，认为偏通胀，自动调低奖励
set economy_low_activity_net_per_hour "30000"     # 当每小时全服净流入 < 3w，认为偏冷清，自动调高奖励
set economy_scale_step "0.05"                     # 每次微调步长 (5%)
set economy_min_reward_scale "0.8"                # 奖励倍率调整下限
set economy_max_reward_scale "1.4"                # 奖励倍率调整上限

# 统一经济网关 + 数据仪表盘 + 原子任务节点
ensure core_economy
ensure economy-dashboard
ensure atom_nodes

# Discord 统一经济日志 Webhook 链接
# ⚠️ 替换为你的 Discord Webhook URL（从 Discord 频道设置 → 集成 → Webhook 获取）
# 留空字符串 = 禁用 Discord 经济日志推送
set economy_discord_webhook ""
