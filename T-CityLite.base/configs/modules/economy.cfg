# T-City Lite v0.3 - 经济平衡配置文件
# 用于统一配置全服的经济倍率与流向微调机制

# 全局资金/奖励倍率 (任务结算、抢劫结算、打工薪水等)
# ⚠ 单位是「倍率」不是百分数：1.0 = 1x，0.8 = 八折，1.5 = 1.5 倍。
#    core_economy / qb-shops / economy-dashboard / custom-economy 四个读者都按这个单位解析；
#    写成 80 会被当成 80 倍（见 docs/engineering/STANDARDS.md TS-7 与
#    tests/unit/layer1_core/test_economy_multiplier.py）。
set economy_reward_scale "1.0"

# ── 薪资抑制（R2）──────────────────────────────────────────────────────────
# qb-core 每 PayCheckTimeOut 分钟（config.lua 里 = 10，即 6 次/小时）按职业等级发
# grades[level].payment；原始区间 10–200 → $60–1,200/小时的白拿收入，会盖过循环职业
# 的干活收益（garbage/bus/trucker 1,400–2,800 $/h）。这里只压 QBShared.Jobs 那张表，
# 不改 qb-core 一行（实现：core_economy 的 server/salary_scale.lua，幂等、从原始值重算）。
#
# economy_salary_scale 乘数：1.0 = 不动（安全默认），0.35 = 打三五折
# economy_salary_cap   单次上限（美元），0 = 不封顶
#
# 当前 0.35 / 50 → 单次 $4–50，折算 $24–300/小时：低等级靠干活，高等级也不至于挂机致富。
#   回滚：把 scale 改回 "1.0" 并 restart core_economy（从原始值重算，不需要动数据库）。
set economy_salary_scale "0.35"
set economy_salary_cap "50"
# 全局价格/开销倍率 (商店商品售价、修车费用、医疗费等，默认 1.0)
set economy_price_scale "1.0"

# 自动自适应经济分析窗口时间 (单位：分钟。如果设置为 0 则禁用自动倍率微调)
set economy_sample_window_minutes "60"

# 自适应触发阈值与倍率步长限制 (全服每小时流向分析)
set economy_high_inflation_net_per_hour "150000"  # 当每小时全服净流入 > 15w，认为偏通胀，自动调低奖励
set economy_low_activity_net_per_hour "30000"     # 当每小时全服净流入 < 3w，认为偏冷清，自动调高奖励
set economy_scale_step "0.05"                     # 每次微调步长 (5%)
set economy_min_reward_scale "0.8"                # 奖励倍率调整下限
set economy_max_reward_scale "1.4"                # 奖励倍率调整上限

# 统一经济网关 + 数据仪表盘 + 原子任务节点
ensure core_economy
ensure economy-dashboard
ensure atom_nodes

# 便利店 / 酒类店 / 五金店（qb-shops）：地图 blip + 购买面板 + 送货任务。
# 2026-11-10 玩法验证发现它不在启动集里 —— 全服一个商店都没有，饥饿/口渴只能靠身上存货，
# 地图上看不到任何 24/7。qb-shops 的商品名都已在 qb-core/shared/items.lua 里，缺的只是启动。
ensure qb-shops

# Discord 统一经济日志 Webhook 链接
# ⚠️ 替换为你的 Discord Webhook URL（从 Discord 频道设置 → 集成 → Webhook 获取）
# 留空字符串 = 禁用 Discord 经济日志推送
set economy_discord_webhook ""
