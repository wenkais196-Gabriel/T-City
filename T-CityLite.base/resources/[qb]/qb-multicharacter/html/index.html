<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <link href="reset.css" rel="stylesheet" />
        <link href="style.css" rel="stylesheet" />
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
        <title>QB-Multicharacter</title>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.1.3/axios.min.js"></script>
        <script src="vue.js"></script>
        <script src="swal2.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/vuetify@2.x/dist/vuetify.js"></script>
        <link href="https://cdn.jsdelivr.net/npm/vuetify@2.x/dist/vuetify.min.css" rel="stylesheet" />
    </head>
    <body>
        <div id="app" v-show="visible">
            <v-app data-app>
                <div class="container">
                    <div class="main-screen" v-if="visible">
                        <!-- Loading Screen -->
                        <transition name="fade">
                            <div class="welcomescreen" v-if="show.loading">
                                <div class="loading-container">
                                    <div class="loading-circle">
                                        <div></div>
                                        <div></div>
                                        <div></div>
                                        <div></div>
                                    </div>
                                    <p>{{loadingText}}</p>
                                </div>
                            </div>
                        </transition>

                        <!-- Character Selection Container -->
                        <div class="character-selection-container" v-if="show.characters">
                            <div v-for="index in characterAmount" :key="index" class="character-square" :class="{'character-selected': selectedCharacter == index}" @click="click_character(index, characters[index] ? 'existing' : 'empty')">
                                <!-- For character slots with data -->
                                <template v-if="characters[index]">
                                    <!-- Character Header -->
                                    <div class="char-header">
                                        <div class="char-fullname">{{characters[index].charinfo.firstname}} {{characters[index].charinfo.lastname}}</div>
                                        <div class="char-citizenid">{{characters[index].citizenid}}</div>
                                    </div>
                                    
                                    <!-- Job & Organization -->
                                    <div class="char-job-box">
                                        <span class="material-symbols-outlined section-icon">work</span>
                                        <div class="section-details">
                                            <div class="section-title">Job & Grade</div>
                                            <div class="section-value">{{characters[index].job.label}} - {{characters[index].job.grade.name}}</div>
                                        </div>
                                    </div>

                                    <!-- Bank & Cash Financials -->
                                    <div class="char-financials">
                                        <div class="fin-item">
                                            <span class="material-symbols-outlined fin-icon cash">payments</span>
                                            <div class="fin-details">
                                                <span class="fin-label">Cash</span>
                                                <span class="fin-value">${{dollar.format(characters[index].money.cash)}}</span>
                                            </div>
                                        </div>
                                        <div class="fin-item">
                                            <span class="material-symbols-outlined fin-icon bank">account_balance</span>
                                            <div class="fin-details">
                                                <span class="fin-label">Bank</span>
                                                <span class="fin-value">${{dollar.format(characters[index].money.bank)}}</span>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- Status Attributes (Progress Bars) -->
                                    <div class="char-status-section">
                                        <!-- Health Status -->
                                        <div class="status-bar-container">
                                            <div class="status-bar-header">
                                                <span class="status-bar-title"><span class="material-symbols-outlined status-icon-health">favorite</span> Health</span>
                                                <span class="status-bar-percent">{{ Math.round((characters[index].metadata?.health || 100) / (characters[index].metadata?.health > 100 ? 2 : 1)) }}%</span>
                                            </div>
                                            <div class="status-bar-bg">
                                                <div class="status-bar-fill health-fill" :style="{width: Math.min(100, Math.round((characters[index].metadata?.health || 100) / (characters[index].metadata?.health > 100 ? 2 : 1))) + '%'}"></div>
                                            </div>
                                        </div>

                                        <!-- Sanity / Stress Status -->
                                        <div class="status-bar-container">
                                            <div class="status-bar-header">
                                                <span class="status-bar-title"><span class="material-symbols-outlined status-icon-sanity">psychology</span> Sanity</span>
                                                <span class="status-bar-percent">{{ 100 - Math.round(characters[index].metadata?.stress || 0) }}%</span>
                                            </div>
                                            <div class="status-bar-bg">
                                                <div class="status-bar-fill sanity-fill" :style="{width: (100 - Math.min(100, Math.round(characters[index].metadata?.stress || 0))) + '%'}"></div>
                                            </div>
                                        </div>

                                        <!-- Hunger Status -->
                                        <div class="status-bar-container">
                                            <div class="status-bar-header">
                                                <span class="status-bar-title"><span class="material-symbols-outlined status-icon-hunger">restaurant</span> Hunger</span>
                                                <span class="status-bar-percent">{{ Math.round(characters[index].metadata?.hunger || 100) }}%</span>
                                            </div>
                                            <div class="status-bar-bg">
                                                <div class="status-bar-fill hunger-fill" :style="{width: Math.min(100, Math.round((characters[index].metadata?.hunger || 100))) + '%'}"></div>
                                            </div>
                                        </div>

                                        <!-- Thirst Status -->
                                        <div class="status-bar-container">
                                            <div class="status-bar-header">
                                                <span class="status-bar-title"><span class="material-symbols-outlined status-icon-thirst">water_drop</span> Thirst</span>
                                                <span class="status-bar-percent">{{ Math.round(characters[index].metadata?.thirst || 100) }}%</span>
                                            </div>
                                            <div class="status-bar-bg">
                                                <div class="status-bar-fill thirst-fill" :style="{width: Math.min(100, Math.round((characters[index].metadata?.thirst || 100))) + '%'}"></div>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- Last Logout Location -->
                                    <div class="char-location-box">
                                        <span class="material-symbols-outlined location-icon">location_on</span>
                                        <div class="location-text" :title="characters[index].location || 'Unknown Location'">
                                            {{characters[index].location || 'Unknown Location'}}
                                        </div>
                                    </div>

                                    <!-- Action buttons at the bottom -->
                                    <div v-if="selectedCharacter == index" class="character-actions">
                                        <div class="action-btn play-btn" @click.stop="play_character">
                                            <span class="material-symbols-outlined">play_circle</span>
                                            <span class="action-btn-text">Enter Game</span>
                                        </div>
                                        <div v-if="allowDelete" class="action-btn delete-btn" @click.stop="prepareDelete">
                                            <span class="material-symbols-outlined">delete</span>
                                            <span class="action-btn-text">Delete Character</span>
                                        </div>
                                    </div>
                                </template>

                                <!-- For empty slots -->
                                <template v-else>
                                    <div class="empty-slot-container" @click.stop="selectedCharacter = index; resetRegisterData(); show.characters = false; show.register = true;">
                                        <div class="empty-slot-plus">+</div>
                                        <div class="empty-slot-text">Create Character</div>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <!-- Character Delete Confirmation -->
                        <transition name="fade">
                            <div class="character-delete" v-if="show.delete">
                                <p>{{translate('deletechar_description')}}</p>
                                <div class="character-delete-btns">
                                    <v-btn class="confirm-btn" v-ripple @click="delete_character">{{translate('confirm')}}</v-btn>
                                    <v-btn class="cancel-btn" v-ripple @click="cancelDelete">{{translate('cancel')}}</v-btn>
                                </div>
                            </div>
                        </transition>

                        <!-- Character Creation Form -->
                        <transition name="fade">
                            <div class="character-register" v-if="show.register">
                                <div>
                                    <p class="characters-register-block-header">{{translate('chardel_header')}}</p>
                                    <span class="material-symbols-outlined" id="close-reg" @click="cancelCreate">close</span>
                                </div>
                                <div class="char-register-inputs">
                                    <v-text-field :placeholder="translate('firstname')" solo hide-details="auto" v-model="registerData.firstname"></v-text-field>
                                    <v-text-field :placeholder="translate('lastname')" solo hide-details="auto" v-model="registerData.lastname"></v-text-field>
                                    <v-text-field v-if="customNationality" :placeholder="translate('nationality')" solo hide-details="auto" v-model="registerData.nationality"></v-text-field>
                                    <v-select v-else solo :placeholder="translate('nationality')" :items="nationalities" hide-details="auto" v-ripple v-model="registerData.nationality"></v-select>
                                    <v-select solo :placeholder="translate('gender')" :items="[translate('male'), translate('female')]" hide-details="auto" v-ripple v-model="registerData.gender"></v-select>
                                    <v-dialog ref="dialog" v-model="dataPickerMenu" :return-value.sync="registerData.date" persistent width="290px">
                                        <template v-slot:activator="{ on, attrs }">
                                            <v-text-field v-model="registerData.date" :label="translate('birthdate')" readonly v-bind="attrs" v-on="on" solo></v-text-field>
                                        </template>
                                        <v-date-picker v-model="registerData.date" min="1900-01-01" max="2100-12-31">
                                            <v-spacer></v-spacer>
                                            <v-btn text class="date-cancel-btn" @click="dataPickerMenu = false">{{translate('cancel')}}</v-btn>
                                            <v-btn text class="date-confirm-btn" @click="$refs.dialog.save(registerData.date)">{{translate('confirm')}}</v-btn>
                                        </v-date-picker>
                                    </v-dialog>
                                </div>
                                <v-btn class="character-reg-btn" v-ripple @click="create_character" large>{{translate('create_button')}}</v-btn>
                            </div>
                        </transition>
                    </div>
                </div>
            </v-app>
        </div>

        <script type="text/javascript" src="profanity.js"></script>
        <script type="text/javascript" src="validation.js"></script>
        <script type="text/javascript" src="translations.js"></script>
        <script type="text/javascript" src="app.js"></script>
    </body>
</html>
