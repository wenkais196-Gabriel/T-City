<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>剧情抉择</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        #decision-panel {
            display: none;
            width: 600px;
            max-width: 90vw;
            background: linear-gradient(180deg, rgba(20,20,30,0.95) 0%, rgba(10,10,20,0.98) 100%);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 8px 8px 0 0;
            padding: 24px 28px 28px;
            margin-bottom: 80px;
            box-shadow: 0 -4px 24px rgba(0,0,0,0.5);
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        #prompt {
            color: #ccc;
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            padding-bottom: 16px;
        }
        #options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .option-btn {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px;
            color: #ddd;
            font-size: 14px;
            text-align: left;
            cursor: pointer;
            transition: all 0.15s ease;
            outline: none;
        }
        .option-btn:hover {
            background: rgba(200,160,60,0.15);
            border-color: rgba(200,160,60,0.4);
            color: #fff;
            transform: translateX(4px);
        }
        .option-btn:active {
            background: rgba(200,160,60,0.25);
        }
        .option-label {
            font-weight: 600;
            color: #c8a03c;
            margin-right: 8px;
        }
        #timer {
            text-align: center;
            color: #666;
            font-size: 12px;
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid rgba(255,255,255,0.04);
        }
        #timer.warning { color: #c84; }
        #timer.danger { color: #c44; }
    </style>
</head>
<body>
    <div id="decision-panel">
        <div id="prompt"></div>
        <div id="options"></div>
        <div id="timer"></div>
    </div>

    <script>
        console.log('[decision-nui] script start');
        var remainingSec = 0;
        var timerInterval = null;

        function openDecision(data) {
            nuiPost('nuiOpened', { n: (data && data.options && data.options.length) || 0, t: String((data && data.type) || '') });
            var panel = document.getElementById('decision-panel');
            var prompt = document.getElementById('prompt');
            var options = document.getElementById('options');
            var timer = document.getElementById('timer');

            prompt.textContent = data.prompt || '做出你的选择...';

            // 渲染选项
            options.innerHTML = '';
            var labels = ['A', 'B', 'C', 'D', 'E', 'F'];
            (data.options || []).forEach(function(opt, idx) {
                var btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = '<span class="option-label">[' + (labels[idx] || '?') + ']</span>' + (opt.text || '选项 ' + (idx+1));
                btn.onclick = function() {
                    chooseOption(opt.id);
                };
                options.appendChild(btn);
            });

            // 倒计时
            remainingSec = data.timeout || 120;
            updateTimer();
            timerInterval = setInterval(function() {
                remainingSec--;
                if (remainingSec <= 0) {
                    clearInterval(timerInterval);
                    nuiPost('decisionTimeout', { reason: 'timeout' });
                    closePanel();
                }
                updateTimer();
            }, 1000);

            panel.style.display = 'block';
        }

        function updateTimer() {
            var timer = document.getElementById('timer');
            var min = Math.floor(remainingSec / 60);
            var sec = remainingSec % 60;
            timer.textContent = '⏳ ' + min + ':' + (sec < 10 ? '0' : '') + sec;

            timer.className = '';
            if (remainingSec <= 15) timer.className = 'danger';
            else if (remainingSec <= 30) timer.className = 'warning';
        }

        function reportNuiError(kind, detail) {
            try {
                fetch('https://' + resourceName() + '/debugNui', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        kind: kind,
                        detail: String(detail && detail.message ? detail.message : detail || '')
                    })
                }).catch(function() {});
            } catch (e) {}
        }

        // NUI 回调必须 POST 到 https://<resource>/...（GetParentResourceName），
        // 而不是页面自身的 host（cfx-nui-story-engine）——后者只会 404，
        // 于是 nuiReady/makeChoice 一次都到不了 Lua（真机遥测 0 条）。
        function resourceName() {
            try {
                if (typeof GetParentResourceName === 'function') return GetParentResourceName();
            } catch (e) {}
            return 'story-engine';
        }

        function nuiPost(path, payload) {
            return fetch('https://' + resourceName() + '/' + path, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload || {})
            }).then(function(r) {
                return r.text();
            }).then(function() {
                return true;
            }).catch(function(err) {
                var timer = document.getElementById('timer');
                if (timer) timer.textContent = '⚠️ NUI 回调失败: ' + (err && err.message ? err.message : 'unknown');
                console.error('[decision-nui] ' + path + ' failed', err);
                reportNuiError(path, err);
                return false;
            });
        }

        function chooseOption(optionId) {
            // 只有 fetch 成功才隐藏面板；失败时保留错误文案，方便定位。
            nuiPost('makeChoice', { optionId: optionId }).then(function(ok) {
                if (ok) closePanel();
            });
        }

        function closeDecision() {
            closePanel();
            nuiPost('closeDecision', {});
        }

        function closePanel() {
            var panel = document.getElementById('decision-panel');
            panel.style.display = 'none';
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        window.addEventListener('error', function(event) {
            reportNuiError('window.error', event && event.message ? event.message : 'unknown');
        });
        window.addEventListener('unhandledrejection', function(event) {
            reportNuiError('unhandledrejection', event && event.reason ? event.reason : 'unknown');
        });

        // 键盘兜底：鼠标/焦点异常时仍可选择；ESC 关闭并释放焦点。
        document.addEventListener('keydown', function(event) {
            var panel = document.getElementById('decision-panel');
            if (!panel || panel.style.display !== 'block') return;
            if (event.key === 'Escape') {
                event.preventDefault();
                closeDecision();
                return;
            }
            var index = parseInt(event.key, 10) - 1;
            var buttons = document.querySelectorAll('.option-btn');
            if (index >= 0 && index < buttons.length) {
                event.preventDefault();
                buttons[index].click();
            }
        });

        // 监听 Lua 端消息
        // 自证握手：客户端只有在收到这条之后才 SendNUIMessage。
        // 真机事故：资源刚重启、CEF 还没加载完就发 openDecision → 消息被丢，
        // 但 SetNuiFocus(true,true) 已经生效 → 画面没有面板、鼠标被锁、什么都点不了。
        nuiPost('nuiReady', { ua: navigator.userAgent });

        window.addEventListener('message', function(event) {
            var data = event.data;
            if (!data || !data.type) return;

            switch (data.type) {
                case 'openDecision':
                    openDecision(data);
                    break;
                case 'closeDecision':
                    closePanel();
                    break;
                case 'testChoose':
                    chooseOption(data.optionId);
                    break;
            }
        });
    </script>
</body>
</html>
