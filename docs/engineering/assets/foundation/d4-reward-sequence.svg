rvice</text><text x="870.0" y="137" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#8fa0bd" text-anchor="middle" font-weight="400" opacity="1.0">qb-core · 内存账本</text><line x1="870" y1="158" x2="870" y2="662" stroke="#2c3a52" stroke-width="1.3" stroke-dasharray="6 6"/><rect x="1022.0" y="96" width="196" height="62" rx="10" fill="#1b2537" stroke="#f6ad55" stroke-width="1.4" opacity="1.0"/><text x="1120.0" y="120" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="13" fill="#f6ad55" text-anchor="middle" font-weight="600" opacity="1.0">DirtyFlush ×2</text><text x="1120.0" y="137" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#8fa0bd" text-anchor="middle" font-weight="400" opacity="1.0">qb-core thin / core-framework</text><line x1="1120" y1="158" x2="1120" y2="662" stroke="#2c3a52" stroke-width="1.3" stroke-dasharray="6 6"/><rect x="1272.0" y="96" width="196" height="62" rx="10" fill="#1b2537" stroke="#68d391" stroke-width="1.4" opacity="1.0"/><text x="1370.0" y="120" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="13" fill="#68d391" text-anchor="middle" font-weight="600" opacity="1.0">MariaDB</text><text x="1370.0" y="137" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#8fa0bd" text-anchor="middle" font-weight="400" opacity="1.0">players / *_records</text><line x1="1370" y1="158" x2="1370" y2="662" stroke="#2c3a52" stroke-width="1.3" stroke-dasharray="6 6"/><path d="M110,200 L360,200" fill="none" stroke="#4fd1c5" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" opacity="1.0" marker-end="url(#ah-4fd1c5)"/><rect x="127.69999999999999" y="180" width="214.6" height="17" rx="4" fill="#0d1220" stroke="none" stroke-width="0" opacity="1.0"/><text x="235.0" y="192" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" fill="#dbe4f3" text-anchor="middle" font-weight="500" opacity="1.0">TriggerReward(src, &#x27;mining&#x27;, 250)</text><path d="M360,238 h44 v30 h-40" fill="none" stroke="#f6ad55" stroke-width="1.7" marker-end="url(#ah-f6ad55)"/><text x="410" y="246" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" fill="#dbe4f3" text-anchor="start" font-weight="400" opacity="1.0">final = base × global × heat × bonus</text><text x="410" y="262" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#fc8181" text-anchor="start" font-weight="400" opacity="1.0">global = GetConvarInt(&#x27;economy_reward_scale&#x27;) / 100  ← 同一 convar 另有 float 读者</text><path d="M360,316 L620,316" fill="none" stroke="#4fd1c5" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" opacity="1.0" marker-end="url(#ah-4fd1c5)"/><rect x="388.9" y="296" width="202.20000000000002" height="17" rx="4" fill="#0d1220" stroke="none" stroke-width="0" opacity="1.0"/><text x="490.0" y="308" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" fill="#dbe4f3" text-anchor="middle" font-weight="500" opacity="1.0">AddMoney(&#x27;bank&#x27;, final, reason)</text><path d="M620,370 L870,370" fill="none" stroke="#68d391" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" opacity="1.0" marker-end="url(#ah-68d391)"/><rect x="597.4" y="350" width="295.2" height="17" rx="4" fill="#0d1220" stroke="none" stroke-width="0" opacity="1.0"/><text x="745.0" y="362" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" fill="#dbe4f3" text-anchor="middle" font-weight="500" opacity="1.0">AddMoney(citizenid, moneytype, amount, reason)</text><text x="745.0" y="386" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#f6ad55" text-anchor="middle" font-weight="400" opacity="1.0">只有 Offline 分支才过 ValidateMoneyEvent</text><path d="M870,412 h44 v30 h-40" fill="none" stroke="#68d391" stroke-width="1.7" marker-end="url(#ah-68d391)"/><text x="920" y="420" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" fill="#dbe4f3" text-anchor="start" font-weight="400" opacity="1.0">money[bank] += n · IsDirty = true</text><text x="920" y="436" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#f6ad55" text-anchor="start" font-weight="400" opacity="1.0">UpdatePlayerData() → 每次金额变动都全量下发一次</text><path d="M870,490 L1120,490" fill="none" stroke="#f6ad55" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" opacity="1.0" marker-end="url(#ah-f6ad55)"/><rect x="924.9" y="470" width="140.20000000000002" height="17" rx="4" fill="#0d1220" stroke="none" stroke-width="0" opacity="1.0"/><text x="995.0" y="482" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" fill="#dbe4f3" text-anchor="middle" font-weight="500" opacity="1.0">MarkDirty(cid, &#x27;all&#x27;)</text><text x="995.0" y="506" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#fc8181" text-anchor="middle" font-weight="400" opacity="1.0">dataType 写成字面量键 → 无法做字段增量</text><path d="M1120,532 h44 v30 h-40" fill="none" stroke="#f6ad55" stroke-width="1.7" marker-end="url(#ah-f6ad55)"/><text x="1170" y="540" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" fill="#dbe4f3" text-anchor="start" font-weight="400" opacity="1.0">Wait(900s) tick</text><text x="1170" y="556" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#fc8181" text-anchor="start" font-weight="400" opacity="1.0">两个定时器，各刷各的池</text><path d="M1120,608 L1370,608" fill="none" stroke="#68d391" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" opacity="1.0" marker-end="url(#ah-68d391)"/><rect x="1128.0" y="588" width="234.0" height="17" rx="4" fill="#0d1220" stroke="none" stroke-width="0" opacity="1.0"/><text x="1245.0" y="600" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" fill="#dbe4f3" text-anchor="middle" font-weight="500" opacity="1.0">INSERT … ON DUPLICATE KEY UPDATE</text><text x="1245.0" y="624" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#f6ad55" text-anchor="middle" font-weight="400" opacity="1.0">逐玩家一条，无批量、无事务</text><path d="M1370,664 L1120,664" fill="none" stroke="#fc8181" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" opacity="1.0" stroke-dasharray="6 5" marker-end="url(#ah-fc8181)"/><rect x="1187.5" y="644" width="115.0" height="17" rx="4" fill="#0d1220" stroke="none" stroke-width="0" opacity="1.0"/><text x="1245.0" y="656" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" fill="#dbe4f3" text-anchor="middle" font-weight="500" opacity="1.0">(async · 无 ack)</text><text x="1245.0" y="680" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#fc8181" text-anchor="middle" font-weight="400" opacity="1.0">写失败也把 dirty 清掉 → 静默丢数据</text><rect x="40" y="690" width="700" height="100" rx="10" fill="#151d2f" stroke="#fc8181" stroke-width="1.2" opacity="1.0" stroke-dasharray="5 4"/><text x="58" y="716" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="12.5" fill="#fc8181" text-anchor="start" font-weight="700" opacity="1.0">两条「已经写好但永远不会发生」的路径</text><text x="58" y="740" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.8" fill="#dbe4f3" text-anchor="start" font-weight="400" opacity="1.0">✗ core-framework/services/security_service.lua（561 行）ValidateMoneyEvent 调用方 = 0</text><text x="58" y="762" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.8" fill="#dbe4f3" text-anchor="start" font-weight="400" opacity="1.0">✗ compat.lua:31 pcall(ES.AddMoney, ES, citizenid…) 参数错位 → 恒 false → 100% 回退</text><rect x="770" y="690" width="670" height="100" rx="10" fill="#151d2f" stroke="#f6ad55" stroke-width="1.2" opacity="1.0" stroke-dasharray="5 4"/><text x="788" y="716" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="12.5" fill="#f6ad55" text-anchor="start" font-weight="700" opacity="1.0">这条链路上要补的两件事</text><text x="788" y="740" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="10.8" fill="#dbe4f3" text-anchor="start" font-weight="400" opacity="1.0">① 倍率单位统一（float ratio），并让 AddMoney 真的过校验（拒绝语义，不是 clamp）</text><text x="788" y="762" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="10.8" fill="#dbe4f3" text-anchor="start" font-weight="400" opacity="1.0">② 记账与刷盘解耦：一次写 = 一次字段级 dirty；失败重试 + ack + 可观测</text></svg>