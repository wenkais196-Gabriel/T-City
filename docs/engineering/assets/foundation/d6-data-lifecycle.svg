8" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="13.5" fill="#8fa0bd" text-anchor="middle" font-weight="700" opacity="1.0">JOINING</text><text x="160.0" y="180" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#8fa0bd" text-anchor="middle" font-weight="400" opacity="1.0">客户端 connect</text><rect x="60" y="260" width="200" height="72" rx="12" fill="#1b2537" stroke="#63b3ed" stroke-width="1.6" opacity="1.0"/><text x="160.0" y="288" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="13.5" fill="#63b3ed" text-anchor="middle" font-weight="700" opacity="1.0">LOADING</text><text x="160.0" y="310" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#8fa0bd" text-anchor="middle" font-weight="400" opacity="1.0">SELECT * FROM players</text><rect x="60" y="390" width="200" height="72" rx="12" fill="#1b2537" stroke="#68d391" stroke-width="1.6" opacity="1.0"/><text x="160.0" y="418" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="13.5" fill="#68d391" text-anchor="middle" font-weight="700" opacity="1.0">LOADED</text><text x="160.0" y="440" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#8fa0bd" text-anchor="middle" font-weight="400" opacity="1.0">PlayerData 在内存</text><rect x="60" y="520" width="200" height="72" rx="12" fill="#1b2537" stroke="#f6ad55" stroke-width="1.6" opacity="1.0"/><text x="160.0" y="548" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="13.5" fill="#f6ad55" text-anchor="middle" font-weight="700" opacity="1.0">DIRTY</text><text x="160.0" y="570" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#8fa0bd" text-anchor="middle" font-weight="400" opacity="1.0">MarkDirty(cid,&#x27;all&#x27;)</text><rect x="420" y="520" width="200" height="72" rx="12" fill="#1b2537" stroke="#f6ad55" stroke-width="1.6" opacity="1.0"/><text x="520.0" y="548" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="13.5" fill="#f6ad55" text-anchor="middle" font-weight="700" opacity="1.0">QUEUED</text><text x="520.0" y="570" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#8fa0bd" text-anchor="middle" font-weight="400" opacity="1.0">等 900s tick</text><rect x="780" y="520" width="200" height="72" rx="12" fill="#1b2537" stroke="#4fd1c5" stroke-width="1.6" opacity="1.0"/><text x="880.0" y="548" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="13.5" fill="#4fd1c5" text-anchor="middle" font-weight="700" opacity="1.0">FLUSHING</text><text x="880.0" y="570" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#8fa0bd" text-anchor="middle" font-weight="400" opacity="1.0">Save(true) / 直接 upsert</text><rect x="1140" y="520" width="200" height="72" rx="12" fill="#1b2537" stroke="#68d391" stroke-width="1.6" opacity="1.0"/><text x="1240.0" y="548" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="13.5" fill="#68d391" text-anchor="middle" font-weight="700" opacity="1.0">SAVED</text><text x="1240.0" y="570" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#8fa0bd" text-anchor="middle" font-weight="400" opacity="1.0">行已落库</text><rect x="1140" y="660" width="200" height="72" rx="12" fill="#1b2537" stroke="#8fa0bd" stroke-width="1.6" opacity="1.0"/><text x="1240.0" y="688" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="13.5" fill="#8fa0bd" text-anchor="middle" font-weight="700" opacity="1.0">DROPPED</text><text x="1240.0" y="710" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#8fa0bd" text-anchor="middle" font-weight="400" opacity="1.0">playerDropped</text><rect x="780" y="660" width="200" height="72" rx="12" fill="#1b2537" stroke="#fc8181" stroke-width="1.6" opacity="1.0"/><text x="880.0" y="688" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="13.5" fill="#fc8181" text-anchor="middle" font-weight="700" opacity="1.0">FAILED</text><text x="880.0" y="710" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#8fa0bd" text-anchor="middle" font-weight="400" opacity="1.0">DB 报错 / 超时</text><path d="M160,202 L160,258" fill="none" stroke="#4fd1c5" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" opacity="1.0" marker-end="url(#ah-4fd1c5)"/><text x="170" y="232" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#4fd1c5" text-anchor="start" font-weight="400" opacity="1.0">onPlayerJoining</text><path d="M160,332 L160,388" fill="none" stroke="#4fd1c5" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" opacity="1.0" marker-end="url(#ah-4fd1c5)"/><text x="170" y="362" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#4fd1c5" text-anchor="start" font-weight="400" opacity="1.0">PlayerLoaded</text><path d="M160,462 L160,518" fill="none" stroke="#f6ad55" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" opacity="1.0" marker-end="url(#ah-f6ad55)"/><text x="170" y="492" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#f6ad55" text-anchor="start" font-weight="400" opacity="1.0">任何写：钱 / 物品 / 位置</text><path d="M260,556 L418,556" fill="none" stroke="#f6ad55" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" opacity="1.0" marker-end="url(#ah-f6ad55)"/><text x="339" y="546" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#f6ad55" text-anchor="start" font-weight="400" opacity="1.0">tick 到期（900s）</text><path d="M620,556 L778,556" fill="none" stroke="#4fd1c5" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" opacity="1.0" marker-end="url(#ah-4fd1c5)"/><text x="699" y="546" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#4fd1c5" text-anchor="start" font-weight="400" opacity="1.0">轮到它</text><path d="M980,556 L1138,556" fill="none" stroke="#68d391" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" opacity="1.0" marker-end="url(#ah-68d391)"/><text x="1059" y="546" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#68d391" text-anchor="start" font-weight="400" opacity="1.0">ack</text><path d="M1240,592 L1240,658" fill="none" stroke="#8fa0bd" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" opacity="1.0" marker-end="url(#ah-8fa0bd)"/><text x="1250" y="630" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#8fa0bd" text-anchor="start" font-weight="400" opacity="1.0">下线 / 会话结束</text><path d="M880,592 L880,658" fill="none" stroke="#fc8181" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" opacity="1.0" stroke-dasharray="6 5" marker-end="url(#ah-fc8181)"/><text x="890" y="630" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#fc8181" text-anchor="start" font-weight="400" opacity="1.0">现状：清 dirty → 丢</text><path d="M780,732 L160,732 L160,596" fill="none" stroke="#fc8181" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" opacity="1.0" stroke-dasharray="6 5" marker-end="url(#ah-fc8181)"/><text x="470" y="724" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#fc8181" text-anchor="start" font-weight="400" opacity="1.0">目标：保留 dirty + 指数退避重试，回到 DIRTY</text><rect x="60" y="760" width="640" height="96" rx="10" fill="#151d2f" stroke="#f6ad55" stroke-width="1.2" opacity="1.0"/><text x="78" y="786" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="12.5" fill="#f6ad55" text-anchor="start" font-weight="700" opacity="1.0">现状：两个定时器抢同一个状态机</text><text x="78" y="810" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="10.8" fill="#dbe4f3" text-anchor="start" font-weight="400" opacity="1.0">qb-core 的 thin 池 + core-framework 的 LocalDirtyFlush 各有一个 900s tick；</text><text x="78" y="832" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="10.8" fill="#dbe4f3" text-anchor="start" font-weight="400" opacity="1.0">两边都能把 DIRTY 推到 FLUSHING，所以「谁写的、写没写成功」没有单一答案。</text><rect x="720" y="760" width="720" height="96" rx="10" fill="#151d2f" stroke="#68d391" stroke-width="1.2" opacity="1.0"/><text x="738" y="786" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="12.5" fill="#68d391" text-anchor="start" font-weight="700" opacity="1.0">目标：状态机只有一个驱动者</text><text x="738" y="810" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="10.8" fill="#dbe4f3" text-anchor="start" font-weight="400" opacity="1.0">Store.flush(cid) 是唯一出口：字段级 dirty 位图 → 单条多列 upsert → ack 回写 → 失败保留 + 退避</text><text x="738" y="832" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="10.8" fill="#dbe4f3" text-anchor="start" font-weight="400" opacity="1.0">停机 / 下线 / 踢人：同一出口 + 同步等待 ack（停服才允许阻塞）</text></svg>