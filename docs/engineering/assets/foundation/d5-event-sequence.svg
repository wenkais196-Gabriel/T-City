<svg viewBox="0 0 1480 752" width="100%" xmlns="http://www.w3.org/2000/svg" style="display:block"><defs><marker id="ah-4fd1c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1c5"/></marker><marker id="ah-63b3ed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#63b3ed"/></marker><marker id="ah-fc8181" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fc8181"/></marker><marker id="ah-f6ad55" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f6ad55"/></marker><marker id="ah-68d391" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#68d391"/></marker><marker id="ah-b794f4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b794f4"/></marker><marker id="ah-8fa0bd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8fa0bd"/></marker></defs><rect x="0" y="0" width="1480" height="752" rx="0" fill="#0d1220" stroke="none" stroke-width="0" opacity="1.0"/><text x="40" y="46" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="22" fill="#dbe4f3" text-anchor="start" font-weight="600" opacity="1.0">图 5 · 时序图：客户端触发一个 net event</text><text x="40" y="70" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="12.5" fill="#8fa0bd" text-anchor="start" font-weight="400" opacity="1.0">蓝色 = 目标形态；灰色 = 现状里这一步由各资源自己写，没有统一入口</text><rect x="12.0" y="96" width="196" height="62" rx="10" fill="#1b2537" stroke="#63b3ed" stroke-width="1.4" opacity="1.0"/><text x="110.0" y="120" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="13" fill="#63b3ed" text-anchor="middle" font-weight="600" opacity="1.0">客户端</text><text x="110.0" y="137" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#8fa0bd" text-anchor="middle" font-weight="400" opacity="1.0">NUI / client Lua</text><line x1="110" y1="158" x2="110" y2="700" stroke="#2c3a52" stroke-width="1.3" stroke-dasharray="6 6"/><rect x="272.0" y="96" width="196" height="62" rx="10" fill="#1b2537" stroke="#8fa0bd" stroke-width="1.4" opacity="1.0"/><text x="370.0" y="120" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="13" fill="#8fa0bd" text-anchor="middle" font-weight="600" opacity="1.0">FXServer 事件分发</text><text x="370.0" y="137" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#8fa0bd" text-anchor="middle" font-weight="400" opacity="1.0">RegisterNetEvent</text><line x1="370" y1="158" x2="370" y2="700" stroke="#2c3a52" stroke-width="1.3" stroke-dasharray="6 6"/><rect x="542.0" y="96" width="196" height="62" rx="10" fill="#1b2537" stroke="#4fd1c5" stroke-width="1.4" opacity="1.0"/><text x="640.0" y="120" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="13" fill="#4fd1c5" text-anchor="middle" font-weight="600" opacity="1.0">资源 handler</text><text x="640.0" y="137" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#8fa0bd" text-anchor="middle" font-weight="400" opacity="1.0">police · phone · 业务资源</text><line x1="640" y1="158" x2="640" y2="700" stroke="#2c3a52" stroke-width="1.3" stroke-dasharray="6 6"/><rect x="812.0" y="96" width="196" height="62" rx="10" fill="#1b2537" stroke="#f6ad55" stroke-width="1.4" opacity="1.0"/><text x="910.0" y="120" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="13" fill="#f6ad55" text-anchor="middle" font-weight="600" opacity="1.0">Guard（目标 L3）</text><text x="910.0" y="137" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#8fa0bd" text-anchor="middle" font-weight="400" opacity="1.0">Check(src, cap, opts)</text><line x1="910" y1="158" x2="910" y2="700" stroke="#2c3a52" stroke-width="1.3" stroke-dasharray="6 6"/><rect x="1062.0" y="96" width="196" height="62" rx="10" fill="#1b2537" stroke="#f6ad55" stroke-width="1.4" opacity="1.0"/><text x="1160.0" y="120" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="13" fill="#f6ad55" text-anchor="middle" font-weight="600" opacity="1.0">RateLimit</text><text x="1160.0" y="137" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#8fa0bd" text-anchor="middle" font-weight="400" opacity="1.0">core-framework 唯一实现</text><line x1="1160" y1="158" x2="1160" y2="700" stroke="#2c3a52" stroke-width="1.3" stroke-dasharray="6 6"/><rect x="1292.0" y="96" width="196" height="62" rx="10" fill="#1b2537" stroke="#68d391" stroke-width="1.4" opacity="1.0"/><text x="1390.0" y="120" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="13" fill="#68d391" text-anchor="middle" font-weight="600" opacity="1.0">DB / 其他资源</text><text x="1390.0" y="137" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#8fa0bd" text-anchor="middle" font-weight="400" opacity="1.0">参数化 SQL · export</text><line x1="1390" y1="158" x2="1390" y2="700" stroke="#2c3a52" stroke-width="1.3" stroke-dasharray="6 6"/><path d="M110,196 L370,196" fill="none" stroke="#4fd1c5" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" opacity="1.0" marker-end="url(#ah-4fd1c5)"/><rect x="67.6" y="176" width="344.8" height="17" rx="4" fill="#0d1220" stroke="none" stroke-width="0" opacity="1.0"/><text x="240.0" y="188" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" fill="#dbe4f3" text-anchor="middle" font-weight="500" opacity="1.0">TriggerServerEvent(&#x27;police:server:autoAlert&#x27;, payload)</text><path d="M370,248 L640,248" fill="none" stroke="#4fd1c5" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" opacity="1.0" marker-end="url(#ah-4fd1c5)"/><rect x="318.0" y="228" width="374.0" height="17" rx="4" fill="#0d1220" stroke="none" stroke-width="0" opacity="1.0"/><text x="505.0" y="240" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" fill="#dbe4f3" text-anchor="middle" font-weight="500" opacity="1.0">handler(source, payload)  ·  source 由引擎给，不信任 payload</text><path d="M640,300 L910,300" fill="none" stroke="#f6ad55" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" opacity="1.0" marker-end="url(#ah-f6ad55)"/><rect x="670.8" y="280" width="208.4" height="17" rx="4" fill="#0d1220" stroke="none" stroke-width="0" opacity="1.0"/><text x="775.0" y="292" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" fill="#dbe4f3" text-anchor="middle" font-weight="500" opacity="1.0">Guard.Check(src, &#x27;police.alert&#x27;)</text><text x="775.0" y="316" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#8fa0bd" text-anchor="middle" font-weight="400" opacity="1.0">现状：if job.type == &#x27;police&#x27; and onDuty —— 每个资源各写一遍</text><path d="M910,358 L1160,358" fill="none" stroke="#f6ad55" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" opacity="1.0" marker-end="url(#ah-f6ad55)"/><rect x="943.2" y="338" width="183.6" height="17" rx="4" fill="#0d1220" stroke="none" stroke-width="0" opacity="1.0"/><text x="1035.0" y="350" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" fill="#dbe4f3" text-anchor="middle" font-weight="500" opacity="1.0">Window(&#x27;src:action&#x27;, n, 60s)</text><path d="M1160,406 L910,406" fill="none" stroke="#f6ad55" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" opacity="1.0" stroke-dasharray="5 4" marker-end="url(#ah-f6ad55)"/><rect x="961.8" y="386" width="146.4" height="17" rx="4" fill="#0d1220" stroke="none" stroke-width="0" opacity="1.0"/><text x="1035.0" y="398" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" fill="#dbe4f3" text-anchor="middle" font-weight="500" opacity="1.0">allowed / retryAfterMs</text><path d="M910,454 L640,454" fill="none" stroke="#f6ad55" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" opacity="1.0" marker-end="url(#ah-f6ad55)"/><rect x="724.5" y="434" width="101.0" height="17" rx="4" fill="#0d1220" stroke="none" stroke-width="0" opacity="1.0"/><text x="775.0" y="446" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" fill="#dbe4f3" text-anchor="middle" font-weight="500" opacity="1.0">ok · 附带清洗后的参数</text><path d="M640,506 L1390,506" fill="none" stroke="#68d391" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" opacity="1.0" marker-end="url(#ah-68d391)"/><rect x="908.5" y="486" width="213.0" height="17" rx="4" fill="#0d1220" stroke="none" stroke-width="0" opacity="1.0"/><text x="1015.0" y="498" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" fill="#dbe4f3" text-anchor="middle" font-weight="500" opacity="1.0">SELECT … WHERE id = ? LIMIT n</text><path d="M640,558 L110,558" fill="none" stroke="#63b3ed" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" opacity="1.0" marker-end="url(#ah-63b3ed)"/><rect x="251.0" y="538" width="248.0" height="17" rx="4" fill="#0d1220" stroke="none" stroke-width="0" opacity="1.0"/><text x="375.0" y="550" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" fill="#dbe4f3" text-anchor="middle" font-weight="500" opacity="1.0">TriggerClientEvent 投影（不是把落库对象原样回显）</text><text x="375.0" y="574" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#8fa0bd" text-anchor="middle" font-weight="400" opacity="1.0">诊断通道例外：只接收、不回包、不落 PII</text><rect x="40" y="616" width="460" height="118" rx="10" fill="#151d2f" stroke="#fc8181" stroke-width="1.2" opacity="1.0" stroke-dasharray="5 4"/><text x="58" y="642" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="12.5" fill="#fc8181" text-anchor="start" font-weight="700" opacity="1.0">现状缺口</text><text x="58" y="666" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="10.8" fill="#dbe4f3" text-anchor="start" font-weight="400" opacity="1.0">· 闸门只扫 3 个目录：179 / 1102 次注册（16%）</text><text x="58" y="688" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="10.8" fill="#dbe4f3" text-anchor="start" font-weight="400" opacity="1.0">· QBCore:DebugSomething（qb-core/server/debug.lua:28）无任何鉴权</text><text x="58" y="710" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="10.8" fill="#dbe4f3" text-anchor="start" font-weight="400" opacity="1.0">· QBCore:UpdatePlayer 无速率限制，每次全量下发</text><text x="58" y="728" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="10.8" fill="#dbe4f3" text-anchor="start" font-weight="400" opacity="1.0">· TriggerClientCallback 可被任意客户端 resolve</text><rect x="520" y="616" width="460" height="118" rx="10" fill="#151d2f" stroke="#68d391" stroke-width="1.2" opacity="1.0"/><text x="538" y="642" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="12.5" fill="#68d391" text-anchor="start" font-weight="700" opacity="1.0">已经做对的部分（拿它当模板）</text><text x="538" y="666" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="10.8" fill="#dbe4f3" text-anchor="start" font-weight="400" opacity="1.0">· core-framework/server/client_reports.lua：控制字符清洗 + 双层限流</text><text x="538" y="688" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="10.8" fill="#dbe4f3" text-anchor="start" font-weight="400" opacity="1.0">· PolicePolicy.Can / hasCapability：统一鉴权令牌，闸门可验证</text><text x="538" y="710" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="10.8" fill="#dbe4f3" text-anchor="start" font-weight="400" opacity="1.0">· RateLimit 三类语义收敛为一处，可注入时间做单测</text><rect x="1000" y="616" width="440" height="118" rx="10" fill="#151d2f" stroke="#4fd1c5" stroke-width="1.2" opacity="1.0" stroke-dasharray="5 4"/><text x="1018" y="642" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="12.5" fill="#4fd1c5" text-anchor="start" font-weight="700" opacity="1.0">标准 TS-5：入站事件三件套</text><text x="1018" y="666" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="10.8" fill="#dbe4f3" text-anchor="start" font-weight="400" opacity="1.0">鉴权：Guard.Check(src, cap) —— cap 必须是常量表里的键</text><text x="1018" y="688" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="10.8" fill="#dbe4f3" text-anchor="start" font-weight="400" opacity="1.0">限流：RateLimit.&lt;key 含 src&gt;，并登记预算（次数/窗口）</text><text x="1018" y="710" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="10.8" fill="#dbe4f3" text-anchor="start" font-weight="400" opacity="1.0">投影：回包只带 UI 需要的字段；诊断不回包</text></svg>