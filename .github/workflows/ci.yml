name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Config & dependency checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python syntax
        run: python3 -m compileall -q tests ../tools
        working-directory: T-CityLite.base

      - name: Agent tool registry drift
        run: python3 tools/agent_tools.py --check

      - name: CFG integrity (ensure targets exist)
        run: python3 tests/check_cfgs.py
        working-directory: T-CityLite.base

      - name: Dependency graph & startup order
        run: python3 tests/check_dependencies.py
        working-directory: T-CityLite.base

      - name: Bus wiring (registrar manifest includes bus.lua)
        run: python3 tests/check_bus_wiring.py
        working-directory: T-CityLite.base

  unit-tests:
    name: Python unit tests (DB tests skip without TCITY_DB_PASS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest and Lua 5.4
        run: |
          python3 -m pip install --only-binary :all: 'pytest==8.3.4'
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4

      - name: Run unit tests
        run: |
          python3 -m pytest -q tests/unit
          python3 -m pytest -q tests/architecture
          python3 -m pytest -q tests/agent
          python3 -m pytest -q ../tests/tools
        working-directory: T-CityLite.base

  lua-syntax:
    name: Lua syntax (changed files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Lua 5.4
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4

      - name: Parse changed Lua files
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="HEAD^"
          fi

          mapfile -t files < <(git diff --name-only "$BASE"...HEAD -- '*.lua' || true)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No Lua changes detected — skipping."
            exit 0
          fi

          fail=0
          for f in "${files[@]}"; do
            [[ -f "$f" ]] || continue
            # FiveM's Lua dialect supports backtick hash literals (`model`),
            # which vanilla luac cannot parse. Skip those files.
            if grep -q '`' "$f"; then
              echo "SKIP (FiveM hash literal): $f"
              continue
            fi
            echo "luac -p $f"
            luac5.4 -p "$f" || fail=1
          done
          exit "$fail"

  docs-check:
    name: Docs links (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check referenced markdown files exist
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re, sys
          root = pathlib.Path('.')
          missing = []
          for md in root.rglob('*.md'):
              if '.git' in md.parts:
                  continue
              text = md.read_text(encoding='utf-8', errors='ignore')
              for target in re.findall(r'\]\(([^)#]+\.md)', text):
                  if target.startswith(('http://', 'https://', 'file://')):
                      continue
                  p = (md.parent / target).resolve()
                  if not p.exists():
                      missing.append(f'{md}: {target}')
          if missing:
              print('⚠️  missing markdown links (advisory):')
              print('\n'.join(missing[:50]))
          PY

  db-schema:
    name: DB schema tests
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: tcity_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: T-CityLite.base
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install DB client + test deps
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client lua5.4
          python -m pip install --upgrade pip pytest mysql-connector-python

      - name: Import schema fixture
        run: mariadb -h 127.0.0.1 -P 3306 -uroot -proot tcity_ci < tests/fixtures/tcity_schema.sql

      - name: Run full test suite against MariaDB
        env:
          TCITY_DB_HOST: 127.0.0.1
          TCITY_DB_PORT: "3306"
          TCITY_DB_USER: root
          TCITY_DB_PASS: root
          TCITY_DB_NAME: tcity_ci
        run: python -m pytest tests -q

  nui:
    name: NUI smoke tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: T-CityLite.base
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip playwright
          python -m playwright install --with-deps chromium

      - name: Run NUI smoke tests
        run: python tests/nui/run_ui_tests.py

  nui-browser:
    name: NUI browser scenarios (phone + tablet)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: T-CityLite.base/resources/[custom]/custom-phone/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          # 路径里的 [custom] 在 glob 里是字符类（会匹配 resources/c/...），所以用无括号的通配
          cache-dependency-path: "**/custom-phone/web/package-lock.json"

      - name: Install dependencies
        run: npm ci

      # 产物必须和源码一致：先构建，再让 baseline 闸门检查 index.html 引用的是真实文件。
      - name: Build the NUI bundle
        run: npm run build

      # web/tests/nui/run.mjs 覆盖的是 pane 契约、任务 App 双面行为、MDT 三栏这些
      # 真实交互；tests/nui/run_ui_tests.py 只验证"打开消息能渲染壳"，两者不重叠。
      - name: Run the browser scenarios on both surfaces
        env:
          # GitHub 托管的 ubuntu 镜像自带 Chrome；harness 不下载浏览器。
          PLAYWRIGHT_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
        run: node tests/nui/run.mjs --surface=both
