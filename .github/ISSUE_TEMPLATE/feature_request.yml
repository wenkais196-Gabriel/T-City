name: Feature / system request
description: 提出一个玩法、系统或工程改进
title: "[feat] "
labels: ["type:feature", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 玩家 / GM / 开发者的真实痛点，而不是"想要一个功能"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 方案
      description: 交互流程、涉及资源、数据结构
    validations:
      required: true
  - type: dropdown
    id: phase
    attributes:
      label: 所属阶段
      options:
        - Phase 1 — 基础功能
        - Phase 2 — 角色扮演 / 多系统
        - Phase 3 — Agent 中枢导演
        - 不确定
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 可测量、可复现的完成定义
      placeholder: |
        - [ ] 新玩家 30 分钟内能 ...
        - [ ] 该事件在 10 并发下 ...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / 风险
      description: 有没有更简单的做法？会不会破坏经济或玩家能动性？
